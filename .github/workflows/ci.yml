name: Windows CI & Release Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup vcpkg cache
      uses: actions/cache@v4
      with:
        path: |
          build/vcpkg_installed
          C:/Users/runneradmin/AppData/Local/vcpkg/archives
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-

    - name: Configure CMake
      run: >
        cmake -S . -B build
        -G "Visual Studio 17 2022" -A x64
        -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

    - name: Build Release Binaries
      run: cmake --build build --config Release

    - name: Execute Unit Test Suite
      run: .\build\Release\mousedpi_tests.exe

    - name: Package Release with CPack
      run: cpack --config build/CPackConfig.cmake -C Release -B dist

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MouseControl-Windows-x64
        path: dist/*.zip
